{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Мета-теги (внутренние страницы переопределяют блоки title и meta) -->
    <title>{% block title %}Новогодние елки с доставкой | Ростов-на-Дону{% endblock %}</title>
    {% block meta %}{% endblock %}

    <!-- Tailwind CSS -->
    {% tailwind_css %}

    <!-- Alpine.js — локальное UI-состояние; HTMX — серверные действия -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body class="min-h-screen bg-base-100 text-base-content flex flex-col">

    {% include 'includes/header.html' %}

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    {% include 'includes/footer.html' %}

</body>
</html>
