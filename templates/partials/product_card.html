{% load shop_extras %}
<article class="{{ card_class|default:'w-60 sm:w-64' }} shrink-0 snap-start scroll-mt-24">
    <a href="{% url 'shop:product' category_slug=product.category.slug product_slug=product.slug %}"
       class="group flex h-full flex-col">
        <div class="overflow-hidden rounded-xl bg-white shadow-sm">
            {% main_image product as image %}
            {% if image %}
                <img src="{{ image.image.url }}" alt="{{ image.alt|default:product.name }}" width="480" height="600"
                     loading="lazy" class="aspect-[4/5] w-full object-cover transition duration-300 group-hover:scale-105">
            {% else %}
                <div class="aspect-[4/5] w-full grid place-items-center bg-base-200 px-4 text-center text-sm font-semibold text-base-content/40">
                    Фото скоро появится
                </div>
            {% endif %}
        </div>
        <h3 class="mt-3 text-lg font-extrabold leading-tight transition group-hover:text-primary sm:text-xl">
            {{ product.name }}
        </h3>
        {% if product.description %}
            <p class="mt-1 text-sm text-base-content/70 line-clamp-2">{{ product.description }}</p>
        {% endif %}
        <p class="mt-1 text-sm font-bold text-base-content/80">{% product_sizes product %}</p>
        <p class="mt-2 text-lg font-black sm:text-xl">{% product_price_range product %}</p>
        <p class="mt-1 font-extrabold text-primary">Заказать</p>
    </a>
</article>
