{% load static %}
<header class="bg-pine text-cream bg-snow">
    <div class="container mx-auto px-4 flex items-center justify-between gap-4 py-3 sm:py-4">
        <a href="{% url 'shop:home' %}" class="flex shrink-0 items-center" aria-label="Ёлкин двор — на главную">
            <img src="{% static 'img/logo_elkin_dvor.png' %}" alt="Ёлкин двор" class="h-10 w-auto sm:h-12">
        </a>
        <div class="flex items-center gap-2 sm:gap-4">
            <a href="{{ SHOP_TELEGRAM_URL }}" target="_blank" rel="noopener" aria-label="Написать в Telegram"
               class="hidden p-2 text-cream/90 transition hover:text-cream sm:inline-flex">
                {% include 'includes/icon.html' with icon='telegram' class_name='w-7 h-7' %}
            </a>
            <a href="{{ SHOP_WHATSAPP_URL }}" target="_blank" rel="noopener" aria-label="Написать в WhatsApp"
               class="hidden p-2 text-cream/90 transition hover:text-cream sm:inline-flex">
                {% include 'includes/icon.html' with icon='whatsapp' class_name='w-7 h-7' %}
            </a>
            <a href="#contacts"
               class="inline-flex items-center rounded-full border-2 border-[#e04a3f] px-6 py-1.5 text-sm font-extrabold text-white transition hover:bg-[#e04a3f]/20 sm:px-8 sm:py-2 sm:text-base">
                Заказать
            </a>
        </div>
    </div>
</header>
