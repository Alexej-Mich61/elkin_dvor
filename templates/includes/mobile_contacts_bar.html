{% comment %}
  Плавающая панель связи для мобильных: Telegram, звонок, WhatsApp.
  Стеклянная «таблетка» в нижнем правом углу.
  На десктопе контакты уже есть в шапке и подвале.
  z-40 (а не 50): чтобы панель уходила ПОД боковое меню, у которого z-50.
{% endcomment %}

            mb-4 rounded-[27.5px] border border-frost/20
            bg-pine-dark/60 shadow-lg backdrop-blur-[4px] px-4 py-3
            flex justify-between items-center gap-[10px] z-40 md:hidden"
     role="toolbar" aria-label="Быстрые контакты">
